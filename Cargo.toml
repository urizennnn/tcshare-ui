[package]
name = "zync"
description = "An advanced CLI tool for transferring files through your terminal."
authors=["urizennnn"]
license="MIT"
readme ="README.md"
version = "0.0.1-alpha"
keywords = ["cli", "file-transfer", "zync"]
edition = "2024"

[workspace]
members = [
	"./lib/tcp/server/",
	"./lib/tcp/client/"
, "./lib/p2p/"]
resolver = "2"
[workspace.lints.rust]
unssafe_code = "forbid"

[lib]
path = "src/lib.rs"



[workspace.dependencies]
once_cell = "1.21.4"
serde = "1.0.228"
serde_json = "1.0.150"
whoami = "2.1.2"
tokio ={version="1.52.3", features=["full"]} 
reqwest = "0.13.4"
log = "0.4.33"
socket2 = "0.6.4"
dirs = "6.0.0"
tokio-util = "0.7.18"
bytes = "1.12.0"
tokio-stream = "0.1.18"
futures-util = "0.3.32"


[dependencies]
log.workspace = true
serde.workspace = true
tokio.workspace = true
whoami.workspace = true
once_cell.workspace = true
serde_json.workspace = true
dirs.workspace = true
reqwest.workspace = true
better-panic = "0.3.0"
color-eyre = "0.6.5"
crossterm = "0.29.0"
derive_setters = "0.1.9"
dialoguer = "0.12.0"
human-panic = "2.0.8"
itertools = "0.15.0"
libc = "0.2.186"
lipsum = "0.9.1"
nanoid = "0.5.0"
open = "5.3.5"
rand = "0.10.1"
ratatui = "0.30.2"
strip-ansi-escapes = "0.2.1"
strum = "0.28.0"
style = "0.1.0"
tui-big-text = "0.8.8"
tui-logger = "0.18.2"
tui-textarea = "0.7.0"
tui_confirm_dialog = "0.4.1"
futures = "0.3.32"
ctrlc = "3.5.2"
ratatui-textarea = "0.9.0"
unicode-width = "0.2"   
rfd = "0.17.2"
chrono = "0.4.45"
igd = "0.12.1"


## workspace
tcp_server = { path = "./lib/tcp/server/" }
tcp_client = { path = "./lib/tcp/client/" }
lib_p2p =   {path="./lib/p2p/"}
strum_macros = "0.28.0"
